name: Build and test Debian 13 amd64 release
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Install release build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential libmosquitto-dev libwxgtk3.2-dev nlohmann-json3-dev python3 python3-venv curl gh
      - uses: actions/checkout@v4
      - name: Verify configuration preservation and routing
        run: |
          python3 -m venv work/dashboard-test-venv
          tar -xzf vendor/mmod-source.tar.gz -C work
          work/dashboard-test-venv/bin/pip install -r work/mmod/requirements.txt httpx
          MMOD_TEST_API=1 work/dashboard-test-venv/bin/python -m unittest discover -s tests -v
      - name: Build pinned sources once
        run: bash build.sh "$(cat VERSION)"
      - name: Verify release binaries and source hashes
        run: bash verify.sh work/build-$(cat VERSION)/bundle
      - name: Save tested packages
        uses: actions/upload-artifact@v4
        with:
          name: mmod-debian13-amd64
          path: dist/*
      - name: Publish tested prerelease
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          RELEASE_TAG="v$(cat VERSION)"
          if [ "$RELEASE_REF" != main ]; then test "$RELEASE_REF" = "$RELEASE_TAG"; fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This version already exists; increment VERSION for a new release.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --prerelease --title "MMOD stack $(cat VERSION)" --notes-file RELEASE-NOTES.md
